<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>C&C Platform</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --red:#ED1E24;--black:#0D0D0D;--white:#FFFFFF;--off:#F8F7F5;
  --ink:#1A1A1A;--muted:#888;--faint:#E8E6E1;--border:#E0DDD8;
  --done:#C8E6C9;--done-ink:#2E7D32;
  --font:'DM Sans',sans-serif;--serif:'Playfair Display',Georgia,serif;
}
body{background:var(--off);font-family:var(--font);color:var(--ink);font-size:14px;font-weight:300;overflow:hidden;}
.app{display:flex;height:100vh;}
.hidden{display:none !important;}
.sidebar{width:56px;background:var(--black);display:flex;flex-direction:column;align-items:center;padding:18px 0 14px;flex-shrink:0;}
.s-logo{width:32px;margin-bottom:22px;}
.s-nav{display:flex;flex-direction:column;gap:2px;flex:1;align-items:center;width:100%;}
.s-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;color:#444;font-size:18px;position:relative;transition:color .15s;}
.s-btn:hover{color:#ccc;}
.s-btn.on{color:var(--red);}
.s-tip{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#1a1a1a;color:#ddd;font-size:11px;padding:4px 9px;border-radius:3px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:99;border:1px solid #2a2a2a;font-family:var(--font);}
.s-btn:hover .s-tip{opacity:1;}
.s-avatar{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;cursor:pointer;border:2px solid #2a2a2a;margin-top:auto;position:relative;}
.s-avatar:hover .s-tip{opacity:1;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:54px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:0;flex-shrink:0;}
.tb-section{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400;cursor:pointer;padding:0 16px;height:100%;display:flex;align-items:center;border-bottom:2px solid transparent;transition:all .15s;}
.tb-section:first-child{padding-left:0;}
.tb-section.on{color:var(--ink);border-bottom-color:var(--red);}
.tb-section:hover:not(.on){color:var(--ink);}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.tb-btn{background:var(--black);color:var(--white);border:none;padding:7px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--font);font-weight:400;cursor:pointer;border-radius:2px;}
.tb-btn:hover{opacity:.85;}
.tb-btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border);}
.tb-btn.ghost:hover{border-color:var(--ink);}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.page{flex:1;overflow-y:auto;padding:28px 32px;}
.dash-top{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;}
.dash-title{font-family:var(--serif);font-size:26px;font-weight:400;}
.dash-sub{font-size:12px;color:var(--muted);font-weight:400;}
.dash-week{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
.dash-week .wi{cursor:pointer;font-size:16px;color:var(--muted);padding:4px 8px;border-radius:3px;border:none;background:none;}
.dash-week .wi:hover{background:var(--faint);}
.dash-week .wl{font-size:13px;font-weight:400;min-width:180px;text-align:center;}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}
.dash-card{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:18px 20px;cursor:pointer;transition:border-color .15s;}
.dash-card:hover{border-color:var(--ink);}
.dash-card .dc-person{font-size:12px;color:var(--muted);margin-bottom:8px;}
.dash-card .dc-count{font-family:var(--serif);font-size:28px;font-weight:400;line-height:1;}
.dash-card .dc-label{font-size:11px;color:var(--muted);margin-top:4px;}
.dash-card.done-card{border-left:3px solid var(--done-ink);}
.dash-card.done-card .dc-count{color:var(--done-ink);}
.dash-card.todo-card{border-left:3px solid var(--red);}
.dash-card.todo-card .dc-count{color:var(--red);}
.dash-card.half-card{border-left:3px solid #E6A100;}
.dash-card.half-card .dc-count{color:#E6A100;}
.task-header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;}
.task-header h2{font-family:var(--serif);font-size:22px;font-weight:400;}
.task-header .th-date{font-size:12px;color:var(--muted);}
.task-list{display:flex;flex-direction:column;gap:4px;}
.task-row{display:grid;grid-template-columns:24px 1fr 90px 90px 28px;align-items:center;gap:12px;padding:10px 14px;background:var(--white);border:1px solid var(--border);border-radius:4px;transition:background .15s;}
.task-row:hover{background:#faf9f7;}
.task-check{width:20px;height:20px;border-radius:3px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.task-check:hover{border-color:var(--ink);}
.task-check.done{background:var(--done-ink);border-color:var(--done-ink);color:#fff;font-size:11px;}
.task-name{font-size:13px;font-weight:400;line-height:1.3;}
.task-name.done{color:var(--muted);text-decoration:line-through;}
.task-type{font-size:11px;color:var(--muted);}
.task-status{font-size:11px;font-weight:500;padding:3px 8px;border-radius:3px;text-align:center;}
.status-done{background:var(--done);color:var(--done-ink);}
.status-half{background:#FFF3CD;color:#856404;}
.status-new{background:#F8D7DA;color:var(--red);}
.task-del{cursor:pointer;color:#ccc;font-size:14px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;}
.task-row:hover .task-del{opacity:1;}
.task-del:hover{color:var(--red);}
.task-add{display:flex;align-items:center;gap:6px;padding:10px 14px;background:none;border:1px dashed var(--border);border-radius:4px;cursor:pointer;color:var(--muted);font-size:12px;margin-top:8px;font-family:var(--font);width:fit-content;transition:all .15s;}
.task-add:hover{border-color:var(--ink);color:var(--ink);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:var(--white);border-radius:8px;width:420px;max-width:90vw;padding:28px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal h3{font-family:var(--serif);font-size:18px;margin-bottom:18px;font-weight:400;}
.modal label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;margin-top:12px;font-weight:400;}
.modal input,.modal select,.modal textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:4px;font-family:var(--font);font-size:13px;outline:none;}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--ink);}
.modal textarea{resize:vertical;min-height:60px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.modal-actions button{padding:8px 20px;border-radius:3px;font-size:12px;font-family:var(--font);font-weight:400;cursor:pointer;border:1px solid var(--border);background:var(--white);}
.modal-actions button.primary{background:var(--black);color:var(--white);border-color:var(--black);}
.modal-actions button.danger{color:var(--red);border-color:var(--red);}
.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:20px;}
.report-card{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:20px;}
.report-card h4{font-family:var(--serif);font-size:15px;margin-bottom:12px;font-weight:400;}
.report-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.report-bar .rb-label{width:80px;font-size:12px;color:var(--muted);flex-shrink:0;}
.report-bar .rb-track{flex:1;height:8px;background:var(--faint);border-radius:4px;overflow:hidden;}
.report-bar .rb-fill{height:100%;border-radius:4px;transition:width .4s;}
.report-bar .rb-val{width:36px;font-size:12px;text-align:right;font-weight:500;}
.report-table{width:100%;border-collapse:collapse;margin-top:12px;}
.report-table th{text-align:left;font-size:11px;color:var(--muted);font-weight:400;padding:6px 8px;border-bottom:1px solid var(--border);}
.report-table td{font-size:12px;padding:6px 8px;border-bottom:1px solid var(--faint);}
.report-legend{display:flex;gap:16px;margin-bottom:16px;}
.report-legend span{font-size:11px;display:flex;align-items:center;gap:4px;}
.report-legend .dot{width:8px;height:8px;border-radius:50%;}
.boards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:20px;}
.board-col{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:16px;min-height:300px;}
.board-col h4{font-size:13px;font-weight:500;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--faint);display:flex;align-items:center;gap:6px;}
.board-col h4 .bc-count{background:var(--faint);border-radius:10px;padding:1px 8px;font-size:11px;}
.board-task{background:var(--off);border:1px solid var(--border);border-radius:4px;padding:10px 12px;margin-bottom:8px;cursor:grab;font-size:12px;line-height:1.4;}
.board-task:hover{border-color:var(--muted);}
.board-task.dragging{opacity:.5;}
.board-task .bt-title{font-weight:400;margin-bottom:4px;}
.board-task .bt-meta{font-size:10px;color:var(--muted);}
.settings-section{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:20px;}
.settings-section h4{font-family:var(--serif);font-size:15px;margin-bottom:14px;font-weight:400;}
.settings-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.settings-row label{width:120px;font-size:12px;color:var(--muted);font-weight:400;}
.settings-row input,.settings-row select{padding:7px 12px;border:1px solid var(--border);border-radius:4px;font-family:var(--font);font-size:13px;outline:none;flex:1;}
.settings-row input:focus,.settings-row select:focus{border-color:var(--ink);}
.settings-actions{display:flex;gap:8px;margin-top:16px;}
.settings-actions button{padding:7px 16px;border-radius:3px;font-size:12px;font-family:var(--font);cursor:pointer;}
.settings-actions button.primary{background:var(--black);color:var(--white);border:none;}
.settings-actions button.ghost{background:none;border:1px solid var(--border);}
.person-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.person-chip{display:flex;align-items:center;gap:6px;background:var(--off);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 5px;font-size:12px;}
.person-chip .pc-dot{width:16px;height:16px;border-radius:50%;}
.person-chip .pc-remove{cursor:pointer;color:var(--muted);margin-left:2px;}
.person-chip .pc-remove:hover{color:var(--red);}
.add-person-row{display:flex;gap:8px;margin-top:10px;}
.add-person-row input{padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-family:var(--font);font-size:12px;flex:1;outline:none;}
.add-person-row button{padding:6px 14px;background:var(--black);color:var(--white);border:none;border-radius:3px;font-size:12px;font-family:var(--font);cursor:pointer;}
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.cal-nav button{background:none;border:1px solid var(--border);border-radius:4px;width:32px;height:32px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.cal-nav button:hover{border-color:var(--ink);}
.cal-nav .cal-title{font-family:var(--serif);font-size:18px;font-weight:400;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.cal-day-header{background:var(--white);padding:8px;text-align:center;font-size:11px;color:var(--muted);font-weight:400;}
.cal-day{background:var(--white);min-height:80px;padding:6px;font-size:11px;}
.cal-day.today{background:#FFF8F0;}
.cal-day .cal-date{font-weight:500;margin-bottom:4px;}
.cal-day .cal-task{font-size:10px;padding:2px 4px;border-radius:2px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--black);color:var(--white);padding:10px 20px;border-radius:4px;font-size:12px;z-index:200;opacity:0;transform:translateY(10px);transition:all .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
<div class="s-logo"><svg viewBox="0 0 32 32"><text x="4" y="24" font-size="22" font-weight="600" fill="#ED1E24" font-family="serif">C</text></svg></div>
<div class="s-nav">
<div class="s-btn on" data-view="dashboard"><i class="ti ti-layout-dashboard"></i><span class="s-tip">Dashboard</span></div>
<div class="s-btn" data-view="todo"><i class="ti ti-clipboard-check"></i><span class="s-tip">Todo</span></div>
<div class="s-btn" data-view="boards"><i class="ti ti-columns"></i><span class="s-tip">Boards</span></div>
<div class="s-btn" data-view="calendar"><i class="ti ti-calendar"></i><span class="s-tip">Calendar</span></div>
<div class="s-btn" data-view="reports"><i class="ti ti-chart-bar"></i><span class="s-tip">Reports</span></div>
<div class="s-btn" data-view="settings"><i class="ti ti-settings"></i><span class="s-tip">Settings</span></div>
</div>
<div class="s-avatar" id="avatarBtn">S<span class="s-tip">Settings</span></div>
</div>
<div class="main">
<div class="topbar">
<div class="tb-section" id="tbProject">C&C Platform</div>
<div class="tb-section" id="tbWeek">Week of Jun 8</div>
<div class="tb-right">
<button class="tb-btn ghost" id="btnImport" style="display:none">Import</button>
<button class="tb-btn ghost" id="btnExport" style="display:none">Export</button>
</div>
</div>
<div class="content">
<div class="page" id="view-dashboard">
<div class="dash-top"><h1 class="dash-title">Dashboard</h1><span class="dash-sub" id="dashSub"></span></div>
<div class="dash-week"><button class="wi" id="weekPrev">&#9664;</button><div class="wl" id="weekLabel"></div><button class="wi" id="weekNext">&#9654;</button></div>
<div class="dash-grid" id="dashGrid"></div>
</div>
<div class="page hidden" id="view-todo">
<div class="task-header"><h2 id="todoTitle">Tasks</h2><span class="th-date" id="todoDate"></span></div>
<div class="dash-week" id="todoWeekNav"><button class="wi" id="todoWeekPrev">&#9664;</button><div class="wl" id="todoWeekLabel"></div><button class="wi" id="todoWeekNext">&#9654;</button></div>
<div class="task-list" id="taskList"></div>
<button class="task-add" id="btnAddTask"><i class="ti ti-plus"></i> Add Task</button>
</div>
<div class="page hidden" id="view-boards">
<h1 class="dash-title" style="margin-bottom:16px">Boards</h1>
<div class="boards-grid" id="boardsGrid"></div>
</div>
<div class="page hidden" id="view-calendar">
<h1 class="dash-title" style="margin-bottom:16px">Calendar</h1>
<div class="cal-nav"><button id="calPrev">&#9664;</button><div class="cal-title" id="calTitle"></div><button id="calNext">&#9654;</button></div>
<div class="cal-grid" id="calGrid"></div>
</div>
<div class="page hidden" id="view-reports">
<h1 class="dash-title" style="margin-bottom:16px">Reports</h1>
<div class="report-grid" id="reportGrid"></div>
</div>
<div class="page hidden" id="view-settings">
<h1 class="dash-title" style="margin-bottom:16px">Settings</h1>
<div class="settings-section">
<h4>Week Configuration</h4>
<div class="settings-row"><label>Week Start</label><select id="weekStart"><option value="mon">Monday</option><option value="sun">Sunday</option></select></div>
<div class="settings-row"><label>Default Hours</label><input type="number" id="defaultHours" value="8" min="1" max="24"></div>
</div>
<div class="settings-section">
<h4>People</h4>
<div class="person-list" id="personList"></div>
<div class="add-person-row"><input type="text" id="newPersonName" placeholder="Name"><input type="color" id="newPersonColor" value="#ED1E24" style="width:40px;padding:2px;border:1px solid var(--border);border-radius:4px;"><button onclick="addPerson()">Add</button></div>
</div>
<div class="settings-section">
<h4>Data</h4>
<div class="settings-actions">
<button class="primary" onclick="saveData()">Save to LocalStorage</button>
<button class="ghost" onclick="exportData()">Export JSON</button>
<button class="ghost" onclick="document.getElementById('importFile').click()">Import JSON</button>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
<button class="ghost" style="color:var(--red);border-color:var(--red)" onclick="resetData()">Reset All</button>
</div>
</div>
<div class="settings-section">
<h4>About</h4>
<p style="font-size:12px;color:var(--muted);line-height:1.6;">C&C Platform v1.0 — Task &amp; Communication Manager</p>
</div>
</div>
</div>
</div>
</div>
<div id="modalContainer"></div>
<div class="toast" id="toast"></div>
<script>
// DATA MODEL
const DEFAULTS = {
  people: [
    { id: 'p1', name: 'Helen', color: '#ED1E24' },
    { id: 'p2', name: 'Sam', color: '#2196F3' },
    { id: 'p3', name: 'Jordan', color: '#FF9800' }
  ],
  projects: [
    { id: 'proj1', name: 'C&C Platform', people: ['p1','p2','p3'] }
  ],
  weeks: {},
  settings: { weekStart: 'mon', defaultHours: 8 }
};

let data, currentView = 'dashboard', currentProject = 'proj1', currentWeek = getWeekKey(new Date());
let todoPerson = null;

function getWeekKey(d, weekStart) {
  weekStart = weekStart || (data && data.settings ? data.settings.weekStart : 'mon');
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = day === 0 ? (weekStart === 'sun' ? 0 : -6) : (day - (weekStart === 'sun' ? 7 : 1));
  dt.setDate(dt.getDate() - diff);
  dt.setHours(0,0,0,0);
  return dt.toISOString().slice(0,10);
}

function getWeekDates(key) {
  const start = new Date(key + 'T00:00:00');
  const ws = data && data.settings ? data.settings.weekStart : 'mon';
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  return { start, end };
}

function weekLabel(key) {
  const { start, end } = getWeekDates(key);
  const opts = { month: 'short', day: 'numeric' };
  return start.toISOString().slice(0,10) === end.toISOString().slice(0,10)
    ? start.toLocaleDateString('en-GB', opts)
    : start.toLocaleDateString('en-GB', opts) + ' \u2013 ' + end.toLocaleDateString('en-GB', opts);
}

function weekLabelFull(key) {
  const { start, end } = getWeekDates(key);
  return start.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) + ' \u2013 ' + end.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

function getWeekTasks(weekKey) {
  const wk = (data && data.weeks) ? data.weeks[weekKey] : null;
  if (!wk) return [];
  return (wk.tasks || []).filter(t => t.projectId === currentProject);
}

function getWeekData(weekKey) {
  const wk = data.weeks[weekKey] || {};
  const tasks = (wk.tasks || []).filter(t => t.projectId === currentProject);
  return { tasks, done: tasks.filter(t => t.status === 'done').length, new: tasks.filter(t => t.status === 'new').length, half: tasks.filter(t => t.status === 'half').length };
}

// PERSISTENCE
function loadData() {
  try {
    const saved = localStorage.getItem('cc_platform_data');
    if (saved) {
      data = JSON.parse(saved);
      if (!data.weeks) data.weeks = {};
      if (!data.settings) data.settings = { weekStart: 'mon', defaultHours: 8 };
      if (!data.people) data.people = DEFAULTS.people;
      if (!data.projects) data.projects = DEFAULTS.projects;
    } else {
      data = JSON.parse(JSON.stringify(DEFAULTS));
      saveData();
    }
  } catch(e) {
    data = JSON.parse(JSON.stringify(DEFAULTS));
    saveData();
  }
  currentWeek = getWeekKey(new Date());
}

function saveData() {
  localStorage.setItem('cc_platform_data', JSON.stringify(data));
  renderAll();
}

function resetData() {
  if (confirm('Reset all data? This cannot be undone.')) {
    data = JSON.parse(JSON.stringify(DEFAULTS));
    saveData();
    showToast('Data reset');
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cc-platform-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  showToast('Exported');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      data = imported;
      saveData();
      showToast('Imported');
    } catch(err) {
      showToast('Import failed: invalid JSON');
    }
  };
  reader.readAsText(file);
}

// NAVIGATION
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.s-btn').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  const page = document.getElementById('view-' + view);
  if (page) page.classList.remove('hidden');
  renderAll();
}

document.querySelectorAll('.s-btn').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});

document.getElementById('avatarBtn').addEventListener('click', () => switchView('settings'));

// RENDERING
function renderAll() {
  renderTopbar();
  if (currentView === 'dashboard') renderDashboard();
  else if (currentView === 'todo') renderTodo();
  else if (currentView === 'boards') renderBoards();
  else if (currentView === 'calendar') renderCalendar();
  else if (currentView === 'reports') renderReports();
  else if (currentView === 'settings') renderSettings();
}

function renderTopbar() {
  document.getElementById('tbWeek').textContent = 'Week of ' + weekLabel(currentWeek);
}

function renderDashboard() {
  const wd = getWeekData(currentWeek);
  const total = wd.done + wd.new + wd.half;
  document.getElementById('dashSub').textContent = total === 0 ? 'No tasks this week' : total + ' task' + (total !== 1 ? 's' : '');
  document.getElementById('weekLabel').textContent = weekLabel(currentWeek);
  const grid = document.getElementById('dashGrid');
  grid.innerHTML = '';

  const cards = [
    { label: 'Done', count: wd.done, cls: 'done-card' },
    { label: 'In Progress', count: wd.half, cls: 'half-card' },
    { label: 'New', count: wd.new, cls: 'todo-card' }
  ];
  cards.forEach(c => {
    const div = document.createElement('div');
    div.className = 'dash-card ' + c.cls;
    div.innerHTML = '<div class="dc-count">' + c.count + '</div><div class="dc-label">' + c.label + '</div>';
    grid.appendChild(div);
  });

  const proj = data.projects.find(p => p.id === currentProject);
  if (proj && proj.people) {
    proj.people.forEach(pid => {
      const person = data.people.find(p => p.id === pid);
      if (!person) return;
      const pTasks = getWeekTasks(currentWeek).filter(t => t.assignedTo === pid);
      const pDone = pTasks.filter(t => t.status === 'done').length;
      const pTotal = pTasks.length;
      const div = document.createElement('div');
      div.className = 'dash-card';
      div.innerHTML = '<div class="dc-person">' + escHtml(person.name) + '</div><div class="dc-count">' + pDone + '/' + pTotal + '</div><div class="dc-label">completed</div>';
      div.addEventListener('click', () => {
        todoPerson = pid;
        switchView('todo');
      });
      grid.appendChild(div);
    });
  }
}

function renderTodo() {
  const tasks = getWeekTasks(currentWeek);
  const proj = data.projects.find(p => p.id === currentProject);
  let filtered = tasks;
  let title = 'All Tasks';
  if (todoPerson) {
    const person = data.people.find(p => p.id === todoPerson);
    filtered = tasks.filter(t => t.assignedTo === todoPerson);
    title = person ? person.name + '\'s Tasks' : 'Tasks';
  }
  document.getElementById('todoTitle').textContent = title;
  document.getElementById('todoDate').textContent = weekLabel(currentWeek);
  document.getElementById('todoWeekLabel').textContent = weekLabel(currentWeek);

  const list = document.getElementById('taskList');
  list.innerHTML = '';
  filtered.sort((a, b) => {
    const order = { done: 0, half: 1, new: 2 };
    return (order[a.status] || 2) - (order[b.status] || 2);
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);font-size:13px;">No tasks this week. Click "Add Task" to create one.</div>';
    return;
  }

  filtered.forEach(task => {
    const person = data.people.find(p => p.id === task.assignedTo);
    const row = document.createElement('div');
    row.className = 'task-row';
    const statusClass = 'status-' + (task.status || 'new');
    const statusLabel = (task.status || 'new').charAt(0).toUpperCase() + (task.status || 'new').slice(1);
    row.innerHTML = '<div class="task-check' + (task.status === 'done' ? ' done' : '') + '" data-id="' + task.id + '">' + (task.status === 'done' ? '<i class="ti ti-check"></i>' : '') + '</div>' +
      '<div class="task-name' + (task.status === 'done' ? ' done' : '') + '">' + escHtml(task.name) + '</div>' +
      '<div class="task-type">' + (person ? person.name : 'Unassigned') + '</div>' +
      '<div class="task-status ' + statusClass + '">' + statusLabel + '</div>' +
      '<div class="task-del" data-id="' + task.id + '"><i class="ti ti-trash"></i></div>';

    row.querySelector('.task-check').addEventListener('click', () => cycleStatus(task));
    row.querySelector('.task-del').addEventListener('click', () => deleteTask(task.id));
    list.appendChild(row);
  });
}

function renderBoards() {
  const tasks = getWeekTasks(currentWeek);
  const proj = data.projects.find(p => p.id === currentProject);
  const grid = document.getElementById('boardsGrid');
  grid.innerHTML = '';

  const cols = [
    { title: 'New', status: 'new', color: 'var(--red)' },
    { title: 'In Progress', status: 'half', color: '#E6A100' },
    { title: 'Done', status: 'done', color: 'var(--done-ink)' }
  ];

  const people = (proj && proj.people) || data.people.map(p => p.id);
  people.forEach(pid => {
    const person = data.people.find(p => p.id === pid);
    if (!person) return;
    cols.forEach(col => {
      const colTasks = tasks.filter(t => t.assignedTo === pid && t.status === col.status);
      const colDiv = document.createElement('div');
      colDiv.className = 'board-col';
      colDiv.innerHTML = '<h4><span style="color:' + col.color + '">&#9679;</span> ' + escHtml(person.name) + ' <span class="bc-count">' + colTasks.length + '</span></h4>';
      colTasks.forEach(task => {
        const t = document.createElement('div');
        t.className = 'board-task';
        t.draggable = true;
        t.innerHTML = '<div class="bt-title">' + escHtml(task.name) + '</div><div class="bt-meta">' + (task.type || 'Task') + ' \u2014 ' + col.title + '</div>';
        t.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', JSON.stringify({ taskId: task.id, fromStatus: col.status, personId: pid }));
          t.classList.add('dragging');
        });
        t.addEventListener('dragend', () => t.classList.remove('dragging'));
        colDiv.appendChild(t);
      });
      colDiv.addEventListener('dragover', (e) => e.preventDefault());
      colDiv.addEventListener('drop', (e) => {
        e.preventDefault();
        try {
          const info = JSON.parse(e.dataTransfer.getData('text/plain'));
          const task = (data.weeks[currentWeek] || {}).tasks.find(t => t.id === info.taskId);
          if (task && task.assignedTo === info.personId) {
            task.status = col.status;
            saveData();
          }
        } catch(err) {}
      });
      grid.appendChild(colDiv);
    });
  });
}

function renderCalendar() {
  const now = new Date();
  const month = now.getMonth();
  const year = now.getFullYear();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startOffset = (firstDay.getDay() + 6) % 7;

  document.getElementById('calTitle').textContent = firstDay.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  days.forEach(d => {
    const h = document.createElement('div');
    h.className = 'cal-day-header';
    h.textContent = d;
    grid.appendChild(h);
  });

  for (let i = 0; i < startOffset; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-day';
    grid.appendChild(empty);
  }

  const weekTasks = getWeekTasks(currentWeek);

  for (let day = 1; day <= lastDay.getDate(); day++) {
    const d = document.createElement('div');
    d.className = 'cal-day';
    if (day === now.getDate() && month === now.getMonth() && year === now.getFullYear()) {
      d.classList.add('today');
    }
    d.innerHTML = '<div class="cal-date">' + day + '</div>';

    if (weekTasks.length > 0 && day <= 5) {
      const taskIndex = (day - 1) % weekTasks.length;
      const task = weekTasks[taskIndex];
      const person = data.people.find(p => p.id === task.assignedTo);
      const span = document.createElement('div');
      span.className = 'cal-task';
      span.style.background = person ? person.color + '22' : '#eee';
      span.style.color = person ? person.color : '#666';
      span.style.borderLeft = '2px solid ' + (person ? person.color : '#ccc');
      span.textContent = task.name;
      span.title = task.name;
      d.appendChild(span);
    }

    grid.appendChild(d);
  }
}

function renderReports() {
  const tasks = getWeekTasks(currentWeek);
  const proj = data.projects.find(p => p.id === currentProject);
  const grid = document.getElementById('reportGrid');
  grid.innerHTML = '';

  const total = tasks.length;
  const done = tasks.filter(t => t.status === 'done').length;
  const half = tasks.filter(t => t.status === 'half').length;
  const newT = tasks.filter(t => t.status === 'new').length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  const pCard = document.createElement('div');
  pCard.className = 'report-card';
  pCard.innerHTML = '<h4>Week Progress</h4><div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>' + pct + '% complete</span><span>' + done + '/' + total + '</span></div><div style="height:10px;background:var(--faint);border-radius:5px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:var(--done-ink);border-radius:5px;transition:width .5s"></div></div></div>' +
    '<div class="report-legend"><span><span class="dot" style="background:var(--done-ink)"></span> Done (' + done + ')</span><span><span class="dot" style="background:#E6A100"></span> In Progress (' + half + ')</span><span><span class="dot" style="background:var(--red)"></span> New (' + newT + ')</span></div>';
  grid.appendChild(pCard);

  const bCard = document.createElement('div');
  bCard.className = 'report-card';
  bCard.innerHTML = '<h4>By Person</h4>';
  if (proj && proj.people && proj.people.length > 0) {
    proj.people.forEach(pid => {
      const person = data.people.find(p => p.id === pid);
      if (!person) return;
      const pTasks = tasks.filter(t => t.assignedTo === pid);
      const pDone = pTasks.filter(t => t.status === 'done').length;
      const pPct = pTasks.length > 0 ? Math.round((pDone / pTasks.length) * 100) : 0;
      bCard.innerHTML += '<div class="report-bar"><div class="rb-label">' + escHtml(person.name) + '</div><div class="rb-track"><div class="rb-fill" style="width:' + pPct + '%;background:' + person.color + '"></div></div><div class="rb-val">' + pPct + '%</div></div>';
    });
  } else {
    bCard.innerHTML += '<div style="font-size:12px;color:var(--muted)">No people assigned</div>';
  }
  grid.appendChild(bCard);

  const tCard = document.createElement('div');
  tCard.className = 'report-card';
  tCard.innerHTML = '<h4>All Tasks</h4><table class="report-table"><thead><tr><th>Task</th><th>Person</th><th>Status</th></tr></thead><tbody>';
  tasks.forEach(task => {
    const person = data.people.find(p => p.id === task.assignedTo);
    const statusClass = 'status-' + (task.status || 'new');
    const statusLabel = (task.status || 'new').charAt(0).toUpperCase() + (task.status || 'new').slice(1);
    tCard.innerHTML += '<tr><td>' + escHtml(task.name) + '</td><td>' + (person ? person.name : '\u2014') + '</td><td><span class="' + statusClass + '" style="display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px">' + statusLabel + '</span></td></tr>';
  });
  tCard.innerHTML += '</tbody></table>';
  grid.appendChild(tCard);
}

function renderSettings() {
  document.getElementById('weekStart').value = (data.settings && data.settings.weekStart) || 'mon';
  document.getElementById('defaultHours').value = (data.settings && data.settings.defaultHours) || 8;

  const list = document.getElementById('personList');
  list.innerHTML = '';
  data.people.forEach(person => {
    const chip = document.createElement('div');
    chip.className = 'person-chip';
    chip.innerHTML = '<span class="pc-dot" style="background:' + person.color + '"></span>' + escHtml(person.name) + '<span class="pc-remove" data-id="' + person.id + '">\u2715;</span>';
    chip.querySelector('.pc-remove').addEventListener('click', () => removePerson(person.id));
    list.appendChild(chip);
  });
}

// ACTIONS
function cycleStatus(task) {
  const flow = { new: 'half', half: 'done', done: 'new' };
  task.status = flow[task.status] || 'half';
  saveData();
}

function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  if (data.weeks[currentWeek] && data.weeks[currentWeek].tasks) {
    data.weeks[currentWeek].tasks = data.weeks[currentWeek].tasks.filter(t => t.id !== id);
  }
  saveData();
}

function addTask(name, assignedTo, type) {
  if (!name.trim()) return;
  if (!data.weeks[currentWeek]) {
    data.weeks[currentWeek] = { tasks: [] };
  }
  const task = {
    id: 't' + Date.now(),
    name: name.trim(),
    assignedTo: assignedTo || (data.people[0] && data.people[0].id) || '',
    status: 'new',
    type: type || 'Task',
    projectId: currentProject,
    createdAt: new Date().toISOString()
  };
  data.weeks[currentWeek].tasks.push(task);
  saveData();
}

function editTask(id, name, assignedTo, type) {
  if (!name.trim()) return;
  const tasks = getWeekTasks(currentWeek);
  const task = tasks.find(t => t.id === id);
  if (task) {
    task.name = name.trim();
    task.assignedTo = assignedTo;
    task.type = type || 'Task';
    saveData();
  }
}

function addPerson() {
  const nameEl = document.getElementById('newPersonName');
  const colorEl = document.getElementById('newPersonColor');
  const name = nameEl.value.trim();
  if (!name) return;
  const id = 'p' + Date.now();
  data.people.push({ id, name, color: colorEl.value });
  nameEl.value = '';
  saveData();
  showToast('Added ' + name);
}

function removePerson(id) {
  const person = data.people.find(p => p.id === id);
  if (!person) return;
  if (!confirm('Remove ' + person.name + '?')) return;
  data.people = data.people.filter(p => p.id !== id);
  const proj = data.projects.find(p => p.id === currentProject);
  if (proj) proj.people = (proj.people || []).filter(pid => pid !== id);
  saveData();
  showToast('Removed ' + person.name);
}

// WEEK NAV
document.getElementById('weekPrev').addEventListener('click', () => {
  const d = new Date(currentWeek + 'T00:00:00');
  d.setDate(d.getDate() - 7);
  currentWeek = getWeekKey(d);
  renderAll();
});

document.getElementById('weekNext').addEventListener('click', () => {
  const d = new Date(currentWeek + 'T00:00:00');
  d.setDate(d.getDate() + 7);
  currentWeek = getWeekKey(d);
  renderAll();
});

document.getElementById('todoWeekPrev').addEventListener('click', () => {
  const d = new Date(currentWeek + 'T00:00:00');
  d.setDate(d.getDate() - 7);
  currentWeek = getWeekKey(d);
  renderAll();
});

document.getElementById('todoWeekNext').addEventListener('click', () => {
  const d = new Date(currentWeek + 'T00:00:00');
  d.setDate(d.getDate() + 7);
  currentWeek = getWeekKey(d);
  renderAll();
});

// CALENDAR NAV
document.getElementById('calPrev').addEventListener('click', () => {
  const now = new Date();
  now.setMonth(now.getMonth() - 1);
  currentWeek = getWeekKey(now);
  renderAll();
});
document.getElementById('calNext').addEventListener('click', () => {
  const now = new Date();
  now.setMonth(now.getMonth() + 1);
  currentWeek = getWeekKey(now);
  renderAll();
});

// SETTINGS SAVE
document.getElementById('weekStart').addEventListener('change', function() {
  data.settings.weekStart = this.value;
  saveData();
  showToast('Settings saved');
});

document.getElementById('defaultHours').addEventListener('change', function() {
  data.settings.defaultHours = parseInt(this.value) || 8;
  saveData();
  showToast('Settings saved');
});

document.getElementById('btnExport').addEventListener('click', exportData);
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('importFile').click());

// MODAL
function showAddTaskModal() {
  const peopleOptions = data.people.map(p => '<option value="' + p.id + '"' + (todoPerson === p.id ? ' selected' : '') + '>' + p.name + '</option>').join('');
  document.getElementById('modalContainer').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)this.innerHTML=\'\'"><div class="modal"><h3>Add Task</h3>' +
    '<label>Task Name</label><input type="text" id="modalTaskName" placeholder="e.g. Review design mockups">' +
    '<label>Assign To</label><select id="modalTaskPerson">' + peopleOptions + '</select>' +
    '<label>Type</label><select id="modalTaskType"><option value="Task">Task</option><option value="Meeting">Meeting</option><option value="Review">Review</option><option value="Research">Research</option></select>' +
    '<div class="modal-actions"><button onclick="this.closest(\'.modal-overlay\').innerHTML=\'\'">Cancel</button><button class="primary" onclick="submitAddTask()">Add Task</button></div></div></div>';
  setTimeout(() => { const el = document.getElementById('modalTaskName'); if (el) el.focus(); }, 100);
}

function submitAddTask() {
  const name = document.getElementById('modalTaskName').value;
  const person = document.getElementById('modalTaskPerson').value;
  const type = document.getElementById('modalTaskType').value;
  addTask(name, person, type);
  document.getElementById('modalContainer').innerHTML = '';
  showToast('Task added');
}

function showEditTaskModal(task) {
  const peopleOptions = data.people.map(p => '<option value="' + p.id + '"' + (task.assignedTo === p.id ? ' selected' : '') + '>' + p.name + '</option>').join('');
  const safeName = escAttr(task.name);
  document.getElementById('modalContainer').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)this.innerHTML=\'\'"><div class="modal"><h3>Edit Task</h3>' +
    '<label>Task Name</label><input type="text" id="modalTaskName" value="' + safeName + '">' +
    '<label>Assign To</label><select id="modalTaskPerson">' + peopleOptions + '</select>' +
    '<label>Type</label><select id="modalTaskType"><option value="Task"' + (task.type === 'Task' ? ' selected' : '') + '>Task</option><option value="Meeting"' + (task.type === 'Meeting' ? ' selected' : '') + '>Meeting</option><option value="Review"' + (task.type === 'Review' ? ' selected' : '') + '>Review</option><option value="Research"' + (task.type === 'Research' ? ' selected' : '') + '>Research</option></select>' +
    '<div class="modal-actions"><button onclick="this.closest(\'.modal-overlay\').innerHTML=\'\'">Cancel</button><button class="primary" onclick="submitEditTask(\'' + task.id + '\')">Save</button><button class="danger" onclick="deleteTask(\'' + task.id + '\');document.getElementById(\'modalContainer\').innerHTML=\'\'">Delete</button></div></div></div>';
}

function submitEditTask(id) {
  const name = document.getElementById('modalTaskName').value;
  const person = document.getElementById('modalTaskPerson').value;
  const type = document.getElementById('modalTaskType').value;
  editTask(id, name, person, type);
  document.getElementById('modalContainer').innerHTML = '';
  showToast('Task updated');
}

// Double-click task to edit
document.addEventListener('dblclick', (e) => {
  const row = e.target.closest('.task-row');
  if (row) {
    const id = row.querySelector('.task-check').dataset.id;
    const tasks = getWeekTasks(currentWeek);
    const task = tasks.find(t => t.id === id);
    if (task) showEditTaskModal(task);
  }
});

document.getElementById('btnAddTask').addEventListener('click', showAddTaskModal);

// KEYBOARD
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('modalContainer').innerHTML = '';
  }
  if (e.key === 'n' && !e.target.matches('input,select,textarea')) {
    if (currentView === 'todo') showAddTaskModal();
  }
});

// UTILITIES
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escAttr(str) {
  return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// INIT
loadData();
renderAll();
</script>
