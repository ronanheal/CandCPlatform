name: Generate Platform Meta

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/generate_meta.py'
      - 'ROADMAP.md'
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore existing meta from streamtime-data branch
        run: |
          git fetch origin streamtime-data
          mkdir -p streamtime-data
          for f in platform_meta.json changelog.json platform_config.json; do
            git show origin/streamtime-data:$f > streamtime-data/$f 2>/dev/null || true
          done

      - name: Generate changelog + platform meta
        run: python3 scripts/generate_meta.py

      - name: Push to streamtime-data branch
        run: |
          git worktree add ../data-branch origin/streamtime-data

          cp streamtime-data/changelog.json ../data-branch/
          cp streamtime-data/platform_meta.json ../data-branch/
          cp streamtime-data/roadmap.json ../data-branch/

          cd ../data-branch
          git config user.name "streamtime-sync[bot]"
          git config user.email "noreply@github.com"
          git add changelog.json platform_meta.json roadmap.json
          git diff --staged --quiet || git commit -m "meta: update changelog + platform meta $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:streamtime-data
