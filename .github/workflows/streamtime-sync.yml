name: Streamtime Sync

on:
  schedule:
    - cron: '0 * * * *'  # every hour on the hour — see streamtime-fast-sync.yml for the
                          # cheap, frequent logged_times/scheduled_todos-only sync. This
                          # full sync stays hourly because it costs ~610 of our 720
                          # req/hour API budget (job phase/item detail backfill).
  workflow_dispatch:       # allow manual trigger from GitHub UI

# Prevent overlapping syncs from racing to push the streamtime-data branch —
# shared with streamtime-fast-sync.yml so the two never push at the same time.
concurrency:
  group: streamtime-data-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main (for the sync script)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore previous data + progress from streamtime-data branch
        run: |
          git fetch origin streamtime-data
          mkdir -p streamtime-data
          for f in jobs.json logged_times.json invoices.json quotes.json companies.json contacts.json users.json expenses.json sync_progress.json; do
            git show origin/streamtime-data:$f > streamtime-data/$f 2>/dev/null || true
          done

      - name: Run sync script
        run: python3 scripts/streamtime_sync.py
        env:
          STREAMTIME_API_KEY: ${{ secrets.STREAMTIME_API_KEY }}

      - name: Push data files to streamtime-data branch
        run: |
          git worktree add ../data-branch origin/streamtime-data

          # Copy all generated JSON files including progress tracker
          cp streamtime-data/*.json ../data-branch/

          cd ../data-branch
          git config user.name "streamtime-sync[bot]"
          git config user.email "noreply@github.com"
          git add *.json
          git diff --staged --quiet || git commit -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:streamtime-data
