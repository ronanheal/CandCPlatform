name: Streamtime Sync

on:
  schedule:
    - cron: '17 */2 * * *'  # backup only — restarts the loop if the chain below ever breaks.
                            # GitHub drops most scheduled runs, so this is not the main trigger.
  workflow_dispatch:         # manual trigger, and how each run queues the next one

# One sync at a time. A run queued while another is going waits and starts right after it.
concurrency:
  group: streamtime-data-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write   # push to streamtime-data
      actions: write    # queue the next run

    steps:
      - name: Checkout main (for the sync scripts)
        uses: actions/checkout@v4
        with:
          ref: main

      # AES-GCM for scripts/data_crypt.py (encrypted .json.enc copies, see docs/SETUP-AUTH.md)
      - name: Install encryption library
        run: |
          python3 -c "import cryptography" 2>/dev/null \
            || python3 -m pip install --quiet --user --break-system-packages cryptography \
            || python3 -m pip install --quiet cryptography

      - name: Sync loop (fast sync every 15 min, full sync hourly, ~5.5h)
        run: bash scripts/sync_loop.sh
        env:
          STREAMTIME_API_KEY: ${{ secrets.STREAMTIME_API_KEY }}
          # Unset → no encryption, exactly as before. 64 hex chars (openssl rand -hex 32).
          DATA_KEY: ${{ secrets.DATA_KEY }}
          # Repo variable; "false" stops publishing the readable copies once the site reads .enc.
          PUBLISH_PLAINTEXT: ${{ vars.PUBLISH_PLAINTEXT || 'true' }}

      # Only on success, so a broken run (e.g. bad API key) can't spin in a tight loop —
      # the 2-hourly schedule above picks things back up instead.
      - name: Queue next run
        if: success()
        run: gh workflow run streamtime-sync.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
